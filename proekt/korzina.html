<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина</title>
  <link rel="stylesheet" href="css/korzina.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    #okno 
    {
      width: 80%;
      max-width: 500px;
      height: auto;
      text-align: center;
      padding: 2%;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9f9f9;
      color: #333;
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  
    #okno h1 
    {
      font-size: 1.5em;
      margin-bottom: 1em;
      color: #555;
    }
  
    #okno p 
    {
      font-size: 0.9em;
      margin: 0.5em 0;
    }
    .OKNO
    {
      background-color: #f9f9f9;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="tel"],
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 1em;
      font-size: 0.9em;
      box-sizing: border-box;
    }
  
    input[type="button"] 
    {
      width: 100%;
      border: none;
      border-radius: 4px;
      padding: 10px;
      background-color: #333;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s;
    }
  
    input[type="button"]:hover 
    {
      background-color: #555;
    }
  
    textarea 
    {
      resize: vertical;
      min-height: 100px;
    }
  
    .close img 
    {
      width: 20px;
      vertical-align: middle;
    }
  
    .zakaz 
    {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #333;
      border-radius: 4px;
      background-color: #333;
      color: #fff;
      text-decoration: none;
      font-size: 1em;
      text-align: center;
      margin-top: 1em;
      cursor: pointer;
    }
  
    .zakaz:hover 
    {
      background-color: #555;
    }
  </style>
</head>

<body>
  <header>
    <div class="blockMenu">
        <div class="back">
          <a href="konstruktor.html">
            <p class="Tback">ГЛАВНАЯ</p>
          </a>
          <img src="img/back.png" class="backI">
          <a href="katalog.html">
            <p class="Tback">КАТАЛОГ</p>
          </a>
          <img src="img/back.png" class="backI">
          <p class="Tback">КОРЗИНА</p>
        </div>
        <div class="divZakaz" id="divZakaz">
          <a href="myzakaz.html" class="header_t"  id="myZ" style="display:none"><p class="Tback">Мои заказы</p></a>
        </div>
        </div>
  </header>
  <div id="Container" class="Container">
    <div class="Con1BLOCK">
      <p class="ID" id="ID">№</p>
      <p class="Bl1Text">Наименование товара</p>
      <p class="Bl1Count">Количество товара</p>
      <p class="Bl1Price">Цена</p>
      <p class="Bl1Price">Удалить товар</p>
    </div>
    <div class="tovaryP" id="tovaryP"></div>
  </div>
  <div class="blockS">
    <div id="Summa" class="Summa">Итого: 0.00 KZT</div>
    <div id="okno" class="Okno">
      <h1 class="OKNO">РЕГИСТРАЦИЯ</h1>
      <p class="OKNO">Заполните форму, консультант предварительно с вами свяжется, <br> для подтверждения заказа!</p>
      <p class="OKNO">e-mail:</p>
      <input type="email" id="kontakty_email"><br>
      <p class="OKNO" id="oknoText">password:</p>
      <input type="password" id="kontakty_password"><br>
      <p class="OKNO">Имя:</p>
      <input type="text" id="kontakty_name">
      <p class="OKNO">Введите адрес:</p>
      <textarea id="kontakty_adress" class="kontakty_adress"></textarea><br>
      <p class="OKNO">Телефон:</p>
      <input type="tel" placeholder="+7 телефон" id="kontakty_phone" value="+7">
      <input type="button" value="ЗАКАЗАТЬ" id="butCart"><br>
      <a href="#" class="close"><img src="img/close.png" id = "closeBut" alt="Закрыть"></a>
    </div>
    <a href="#okno" class="zakaz" id="zakaz">Оформить заказ</a>
  </div>
  <script>
    //clearCart();
      var hours = 1; 
      var now = new Date().getTime();
      var setupTime = localStorage.getItem('setupTime');
      if (setupTime == null) 
      {
        localStorage.setItem('setupTime', now)
      } 
      else 
      {
        if (now - setupTime > hours * 60 * 60 * 1000) 
        {
          localStorage.clear()
          localStorage.setItem('setupTime', now);
        }
      }
    const token = localStorage.getItem('token');
    $('#myZ').show();
    if (!token) 
    {
        localStorage.removeItem('userId');
        $('#myZ').hide();
    }
    let userId = localStorage.getItem('userId');
    if (!userId) 
    {
        localStorage.removeItem('orderId');
    } 
    let orderId = localStorage.getItem('orderId');
    console.log('Token:', token);
    console.log('User ID:', userId);
    console.log('Order ID:', orderId); 
    
    console.log('Before saving cart:', JSON.parse(localStorage.getItem('cart')));
    console.log('After saving cart:', JSON.parse(localStorage.getItem('cart')));
    
    const cartI = $('#tovaryP');
    const Summa = $('#Summa');
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let priceT = 0;

    if (cart.length > 0 && token) 
    {
      console.log('Запустился изменение айди');
      cart = cart.map(item => {
        if ('product_id' in item) 
        {
          return item;
        } 
        else if ('id' in item) 
        {
          const { id, ...rest } = item;
          return {
            ...rest,
            product_id: id
          };
        }
        return item; 
      });

      //localStorage.setItem('cart', JSON.stringify(cart));
    }

    function clearCart() 
    {
        localStorage.removeItem('cart');
        cart = [];
        updateCartDisplay(); 
    }

  function createCartItem(item, index) 
  {
        const tovar = $('<div class="tovaryP2"></div>');

        $('<p class="id-class"></p>').text(index + 1).appendTo(tovar);
        $('<p class="name-class"></p>').text(item.product_name || item.name || 'Неизвестный товар').appendTo(tovar);

        const pCount = $('<input type="number">').val(item.count).addClass("count-class");
        pCount.change(async function () 
        {
          const newCount = parseInt($(this).val(), 10);
          if (newCount > 0) 
          {
            item.count = newCount;

            if (orderId) 
            {
              await saveCartDetail(orderId, item);
            } 
            else 
            {
              let cart = JSON.parse(localStorage.getItem('cart')) || [];
              const itemIndex = cart.findIndex(cartItem => cartItem.id === item.id);
              if (itemIndex > -1) {
                cart[itemIndex] = item;
                localStorage.setItem('cart', JSON.stringify(cart));
              }
            }

            updateCartDisplay();
          } 
          else 
          {
            $(this).val(item.count);
          }
        });
        pCount.appendTo(tovar);

        $('<p></p>').text((item.price * item.count).toFixed(2) + ' KZT').appendTo(tovar);

        const imgGarbage = $('<img>').attr('src', 'img/garbage.png').addClass('imgBl').click(function () {
          removeCartItem(item);
        });
        imgGarbage.appendTo(tovar);

        return tovar;
    }

    function updateCartDisplay() 
    {
        console.log("updateCartDisplay");
        const tovarContainer = $('#tovaryP');
        tovarContainer.empty();
        let priceT = 0;

        const token = localStorage.getItem('token');
        const orderId = localStorage.getItem('orderId');

        if (token && orderId) {
          $.ajax({
            url: `http://localhost:8080/api/orderDetails/${orderId}`,
            headers: { 'Authorization': `Bearer ${token}` },
            success: function (data) {
              console.log('Data from API orderDetails:', data);
              tovarContainer.empty();
              data.forEach((item, index) => {
                const cartItemElement = createCartItem(item, index);
                tovarContainer.append(cartItemElement);
              });
            },
            error: function (error) {
              console.error('Ошибка при получении данных orderDetails:', error);
            }
          });

          $.ajax({
            url: `http://localhost:8080/api/order/${orderId}`,
            headers: { 'Authorization': `Bearer ${token}` },
            success: function (data) {
              priceT = data.summa;
              Summa.text('Итого: ' + priceT.toFixed(2) + ' KZT');
            },
            error: function (error) {
              console.error('Ошибка при получении данных заказа:', error);
            }
          });
        } else {
          const cart = JSON.parse(localStorage.getItem('cart')) || [];
          cart.forEach((item, index) => {
            const cartItemElement = createCartItem(item, index);
            tovarContainer.append(cartItemElement);
            priceT += item.price * item.count;
          });

          Summa.text('Итого: ' + priceT.toFixed(2) + ' KZT');
        }
    }


    async function removeCartItem(orderDetailId) 
    {
        console.log(orderDetailId);
        const token = localStorage.getItem('token');

        if (token) {
          try {
            const response = await fetch(`http://localhost:8080/api/orderDetail/${orderDetailId.id}`,
              {
                method: 'DELETE',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                }
              });

            if (!response.ok) 
            {
              throw new Error(`Error deleting order detail: ${response.statusText}`);
            }

            let responseData = null;
            const contentType = response.headers.get('Content-Type');
            if (contentType && contentType.includes('application/json')) 
            {
              responseData = await response.json();
              console.log('Response from API:', responseData);
            }

            clearCart();
            //await fetchExistingOrder();
          }
          catch (error) 
          {
            console.error('Error deleting order detail:', error);
          }
        }
        else 
        {
          cart = cart.filter(cart => cart.id !== orderDetailId.id); 
          localStorage.setItem('cart', JSON.stringify(cart));
          console.log('Item removed from localStorage:', orderDetailId.id);

          updateCartDisplay();
        }
      }

    async function fetchExistingOrder() 
    {
        console.log('Before saving cart:', JSON.parse(localStorage.getItem('cart')));
        console.log('Запустился fetchExistingOrder - userId:', userId);

        if (!userId) return;

        try 
        {
          const response = await fetch(`http://localhost:8080/api/orders/${userId}`, {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (!response.ok) 
          {
            throw new Error(`Ошибка при получении заказов: ${response.statusText}`);
          }

          const result = await response.json();
          console.log('API Response:', result);

          const orders = Array.isArray(result.orders) ? result.orders : result;

          if (!Array.isArray(orders)) 
          {
            throw new Error('Полученные данные не являются массивом заказов');
          }

          const openOrder = orders.find(order => order.status === 1);
          console.log(openOrder);
          if (openOrder) 
          {
            orderId = openOrder.id;
            console.log("Открытый заказ найден: " + orderId);
            localStorage.setItem('orderId', orderId);
            await fetchOrderDetails(orderId);
          } 
          else 
          {
            console.log("Открытый заказ не найден. Создаем новый.");

            const data = 
            {
              user_id: userId,
              status: 1
            };

            const createOrderResponse = await fetch('http://localhost:8080/api/order', {
              method: 'POST',
              headers: 
              {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify(data)
            });

            if (!createOrderResponse.ok) 
            {
              throw new Error(`Ошибка при создании заказа: ${createOrderResponse.statusText}`);
            }

            const newOrder = await createOrderResponse.json();
            console.log('Новый заказ создан:', newOrder);

            if (newOrder && newOrder.id) 
            {
              orderId = newOrder.id;
              localStorage.setItem('orderId', orderId);
              await fetchOrderDetails(orderId);
            }
          }
        } 
        catch (error) 
        {
          console.error('Ошибка при обработке заказа:', error);
        }
    }

    async function fetchOrderDetails(orderId) 
    {
        console.log('Before saving cart:', JSON.parse(localStorage.getItem('cart')));
        console.log('Запустился fetchOrderDetails - orderId:', orderId);
        const token = localStorage.getItem('token');

        try 
        {
          const response = await fetch(`http://localhost:8080/api/orderDetails/${orderId}`, {
            headers: 
            {
              'Authorization': `Bearer ${token}`
            }
          });

          if (!response.ok) 
          {
            throw new Error('Error fetching order details');
          }

          const dataFromAPI = await response.json();
          console.log('Data from API:', dataFromAPI);

          const currentCart = cart;
          console.log('Cart before updating with API data:', currentCart);

          // Обновление корзины
          const combinedCart = currentCart.filter(item =>
            !dataFromAPI.some(apiItem => apiItem.product_id === item.product_id)
          );
          combinedCart.push(...dataFromAPI);

          console.log('Обновление корзины:', combinedCart);

          localStorage.setItem('cart', JSON.stringify(combinedCart));
          //updateCartDisplay();

          await Promise.all(combinedCart.map(item => saveCartDetail(orderId, item)));
        } 
        catch (error) 
        {
          console.error('Error fetching order details:', error);
        }

        console.log('Local cart items:', JSON.parse(localStorage.getItem('cart')));
  }


  async function saveCartDetail(orderId, item) 
  {
      const token = localStorage.getItem('token');
      const data = 
      {
        order_id: orderId,
        product_id: item.product_id,
        count: item.count,
        price: item.price
      };
      try {
        const response = await fetch('http://localhost:8080/api/orderDetail/checkOnly', 
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) 
        {
          throw new Error(`Error saving order detail: ${response.statusText}`);
        }

        const responseData = await response.json();
        console.log('Response from API:', responseData);

        clearCart();
        //updateCartDisplay();
      } 
      catch (error) 
      {
        console.error('Error saving order detail:', error);
      }
    }

    $(document).ready(async function () 
    {
        if(!token)
        {
          updateCartDisplay();
        }
        // if (token && userId) 
        // {      
        //   const tokenResponse = await fetch('http://localhost:8080/api/user', 
        //   {
        //     method: 'GET',
        //     headers: { 'Authorization': `Bearer ${token}` }
        //   });
        //   if (tokenResponse.ok) 
        //   {
        //     const user = await tokenResponse.json();
        //     userId = user.id;
        //     localStorage.setItem('userId', userId);
        //   }
        // }
        if (userId) 
        {
            $('#loading').show();
            await fetchExistingOrder();
            let localCart = JSON.parse(localStorage.getItem('cart')) || [];
            console.log('Local cart items:', localCart);
            if (localCart.length > 0) 
            {
              if (orderId) 
              {
                await saveCartDetail(orderId);
              } 
              else 
              {
                console.error('Отсутствует orderId');
              }
            } 
            else 
            {
              console.log('Корзина пустая. Нечего сохранять.');
            }
        }
      });

//кнопка
    $(document).ready(async function () 
    {
        $('#closeBut').click(async function (event) 
        {
          $('#okno').hide();
        });

        $('#zakaz').click(async function (event) 
        {
          event.preventDefault();

          const token = localStorage.getItem('token');
          const orderId = localStorage.getItem('orderId');

          if (token) 
          {
            if (orderId) 
            {
              const userId = localStorage.getItem('userId');
              await updateOrderStatus(orderId, userId);
            } 
            else 
            {
              console.error('Отсутствует orderId');
            }
          } 
          else 
          {
            $('#okno').show();
          }
        });

        $('#butCart').click(async function () 
        {
          const email = $('#kontakty_email').val();
          const password = $('#kontakty_password').val();
          const name = $('#kontakty_name').val();
          const address = $('#kontakty_adress').val();
          const phone = $('#kontakty_phone').val();

          if (password.length < 8) 
          {
            console.error('Пароль должен содержать не менее 8 символов');
            return;
          }

          const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
          console.log(cartItems);

          const hasInvalidItem = cartItems.some(item => !item.id || !item.count || !item.price);
          
          if (hasInvalidItem) 
          {
            console.error('Некоторые товары в корзине имеют недостающие поля');
            return;
          }

          try {
            let response = await fetch('http://localhost:8080/api/registerAndOrder', {
              method: 'POST',
              headers: 
              {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                email,
                password,
                name,
                address,
                phone,
                cartItems
              })
            });

             if (!response.ok) 
             {
              const errorData = await response.json();

              if (response.status === 422 && errorData.errors) 
              {
                let errorMessage = 'Такой пользователь уже существует';
                alert(errorMessage);
              } 
              else 
              {
                console.error('Ошибка при оформлении заказа:', errorData);
                alert(`Ошибка: ${errorData.error || response.statusText}`);
              }

              throw new Error(`Ошибка: ${response.statusText}`);
            }

            const data = await response.json();
            const { token, userId, orderId } = data;
            localStorage.setItem('token', token);
            localStorage.setItem('userId', userId);
            localStorage.setItem('orderId', orderId);
            const reduceResponse = await fetch(`http://localhost:8080/api/orderDetail/${orderId}/reduce`, {
              method: 'POST',
              headers: 
              {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              }
          });

          if (!reduceResponse.ok) 
          {
            const errorData = await reduceResponse.json();
            console.error('Ошибка уменьшения количества товаров:', errorData);
            throw new Error(`Ошибка уменьшения количества товаров: ${reduceResponse.statusText}`);
          }
          console.log('Количество товаров обновлено успешно');
          $('#okno').hide();
          localStorage.removeItem('cart');
          localStorage.removeItem('orderId');
          Summa.text('Итого: ' + 0.00 + ' KZT');
          clearCart();
          console.log('Заказ оформлен'); 
          
        } 
        catch (error) 
        {
          console.error('Ошибка при оформлении заказа:', error);
        }
      });

      async function updateOrderStatus(orderId, userId) 
      {
        const token = localStorage.getItem('token');
        try 
        {
          const response = await fetch(`http://localhost:8080/api/order/${orderId}`, {
            method: 'PUT',
            headers: 
            {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ status: 2, user_id: userId })
          });

          if (!response.ok) 
          {
            throw new Error(`Ошибка обновления заказа: ${response.statusText}`);
          }

          console.log('Статус заказа обновлен успешно');

          const reduceResponse = await fetch(`http://localhost:8080/api/orderDetail/${orderId}/reduce`, {
            method: 'POST',
            headers: 
            {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            }
          });

          if (!reduceResponse.ok) 
          {
            throw new Error(`Ошибка уменьшения количества товаров: ${reduceResponse.statusText}`);
          }

          console.log('Количество товаров обновлено успешно');

          const cartItems = JSON.parse(localStorage.getItem('cart')) || [];
          localStorage.removeItem('orderId');
          Summa.text('Итого: ' + 0.00 + ' KZT');
          clearCart();
        } 
        catch (error) 
        {
          console.error('Ошибка при обновлении заказа:', error);
        }
      }
    });
  </script>
</body>
</html>
